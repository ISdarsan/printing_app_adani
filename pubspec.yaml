name: canteen_adani
description: "Canteen Billing App for Adani CSR"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # More flexible SDK range

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0

  # UI packages
  cupertino_icons: ^1.0.8
  lottie: ^2.7.0
  animated_text_kit: ^4.2.2
  google_fonts: ^6.2.1

  # --- Firebase packages ---
  firebase_core: ^2.32.0         # connect to Firebase
  cloud_firestore: ^4.17.5       # Firestore DB
  firebase_auth: ^4.19.6         # auth
  firebase_messaging: ^14.9.4    # FCM push notifications
  # -------------------------

  # For picking images from gallery/camera
  image_picker: ^1.1.2
  fl_chart: ^1.2.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/LOGO.png
    - assets/neon_ring.json
    - assets/appicon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appicon.png"
  min_sdk_android: 21
